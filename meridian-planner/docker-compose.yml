# Local stack: PostgreSQL, API, scheduler worker and web app.
#   cp backend/.env.example backend/.env   # fill in the keys
#   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MERIDIAN_DATABASE_URL: postgresql+psycopg://meridian:meridian@db:5432/meridian
    depends_on: [db]
    ports: ["8000:8000"]
  worker:
    build: ./backend
    command: python -m app.cli worker
    env_file: ./backend/.env
    environment:
      MERIDIAN_DATABASE_URL: postgresql+psycopg://meridian:meridian@db:5432/meridian
    depends_on: [db, api]
  web:
    build:
      context: ./web
      args:
        MERIDIAN_API_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
