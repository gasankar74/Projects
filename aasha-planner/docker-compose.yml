# Local stack: PostgreSQL, Redis (used from Phase 2), API and web app.
#   cp backend/.env.example backend/.env   # fill in the keys
#   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aasha
      POSTGRES_PASSWORD: aasha
      POSTGRES_DB: aasha
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      AASHA_DATABASE_URL: postgresql+psycopg://aasha:aasha@db:5432/aasha
    depends_on: [db]
    ports: ["8000:8000"]
  web:
    build:
      context: ./web
      args:
        AASHA_API_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
